<extend template="base.shtml">

<head id="head">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="generator" content="Zine">
	<meta name="author" content="Pratyay Mustafi">
	<meta name="description" content="$page.description.len().gt(0).then($page.description, 'The blog of a hobbyist navigating the seas of the internet')">
	<link rel="canonical" href="$site.host_url.addPath($page.link())">
	<meta property="og:title" content="$page.title">
	<meta property="og:description" content="$page.description.len().gt(0).then($page.description, 'The blog of a hobbyist navigating the seas of the internet')">
	<meta property="og:url" content="$site.host_url.addPath($page.link())">
	<meta property="og:type" content="$page.isSection().then('website', 'article')">
	<meta property="og:site_name" content="$site.title">
	<meta property="og:locale" content="en_US">
	<meta property="og:image" content="$site.host_url.addPath($site.asset('fanzine.jpg').link())">
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:title" content="$page.title">
	<meta name="twitter:description" content="$page.description.len().gt(0).then($page.description, 'The blog of a hobbyist navigating the seas of the internet')">
	<meta name="twitter:image" content="$site.host_url.addPath($site.asset('fanzine.jpg').link())">
	<meta name="theme-color" content="#1a1a1a">
	<link rel="icon" href="$site.asset('favicon.ico').link()">
	<ctx :if="$site.page('').isCurrent()">
		<title :text="$site.title"></title>
	</ctx>
	<ctx :if="$site.page('').isCurrent().not()">
		<title :text="$site.title.prefix($page.title, ' - ')"></title>
	</ctx>
	<link type="text/css" rel="stylesheet" href="$site.asset('css/style.css').link()">
	<link type="text/css" rel="stylesheet" href="$site.asset('css/highlight.css').link()">
	<link type="text/css" rel="stylesheet" href="$site.asset('css/Temml-Local.css').link()">
	<link rel="alternate" type="application/rss+xml" title="All posts" href="$site.index().alternative('rss-all').link()">
	<link rel="me" href="https://mastodon.social/@realPratyay">
	<meta name="index" href="$site.asset('69be26d93fe446a386772b6d7b3d9781.txt').link()">
	<script defer src="$site.asset('js/render-mathtex.js').link()"></script>
	<script type="module" src="$site.asset('js/shiki-highlight.js').link()"></script>
	<script data-goatcounter="https://pratyay.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<header id="header">
	<super>
</header>
<main id="main">
	<super>
</main>
<footer id="footer">
	<super>
</footer>
