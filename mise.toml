[tools]
aube = "latest"
"github:sass/dart-sass" = "latest"
imagemagick = "latest"
node = "latest"
"npm:pagefind" = "latest"
"npm:parcel" = "latest"
zola = "latest"

[settings]
experimental = true

[tasks.build]
run = "zola build && pagefind --site ./dist && npm run build"
description = "Build the site with Zola, index it for search, and optimize all HTML"

[tasks.search]
run = "zola build && pagefind --site ./dist --serve"
description = "Build, index and preview the site with search at http://localhost:1414"

[tasks.serve]
run = "zola serve"
description = "Serve the site locally"

[tasks.check]
run = "zola check"
description = "Check the site"
