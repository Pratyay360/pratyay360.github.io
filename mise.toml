[tools]
"npm:pagefind" = "1.6.0"
zola = "latest"

[settings]
experimental = true

[tasks.build]
run = "zola build && pagefind --site dist"
description = "Build the site with Zola and index it for search"

[tasks.search]
run = "zola build && pagefind --site dist --serve"
description = "Build, index and preview the site with search at http://localhost:1414"

[tasks.serve]
run = "zola serve"
description = "Serve the site locally"

[tasks.check]
run = "zola check"
description = "Check the site"
