[tools]
biome = "latest"
wrangler = { version = "latest", allow_builds = ["esbuild", "sharp", "workerd"] }
nub = "latest"
node = "latest"
bun = "latest"

[settings]
experimental = true


[tasks.build]
run = '''
nub install
nub run build
nub x pagefind --site dist/
'''
description = "Build the project"

[tasks.preview]
run = "nub run preview"
description = "Preview the project"

