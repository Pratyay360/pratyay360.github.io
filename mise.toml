[tools]
biome = "latest"
node = "26.13.0"
bun = "latest"

[settings]
experimental = true


[tasks.build]
run = '''
bun install
bun run build
bun x pagefind --site dist/
'''
description = "Build the project"

[tasks.preview]
run = "bun run preview"
description = "Preview the project"

