[tools]
"npm:pagefind" = "latest"
zola = "latest"

[settings]
experimental = true

[tasks.build]
run = "zola build && pagefind --site dist"
description = "Build the site with Zola and index it for search"

[tasks.serve]
run = "zola serve"
description = "Serve the site locally"

[tasks.check]
run = "zola check"
description = "Check the site"
