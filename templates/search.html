{% extends "base.html" %}

{% block content %}
<article class="post" data-pagefind-ignore>
  <h1 class="post-title">{{ page.title }}</h1>
  <section class="post-line"></section>
  {{ page.content | safe }}
  <link rel="stylesheet" href="/pagefind/pagefind-component-ui.css" />
  <pagefind-config bundle-path="/pagefind/"></pagefind-config>
  <div id="search">
    <pagefind-input autofocus placeholder="Search docs…"></pagefind-input>
    <pagefind-summary></pagefind-summary>
    <pagefind-results max-results="20"></pagefind-results>
  </div>
  <script src="/pagefind/pagefind-component-ui.js" type="module"></script>
</article>
{% endblock content %}
