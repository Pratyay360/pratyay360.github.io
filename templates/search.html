{% extends "base.html" %}

{% block content %}
<article class="post" data-pagefind-ignore>
  <h1 class="post-title">{{ page.title }}</h1>
  <section class="post-line"></section>
  {{ page.content | safe }}
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@pagefind/component-ui@1.6.0/css/pagefind-component-ui.css" />
  <div id="search">
    <pagefind-input autofocus></pagefind-input>
    <pagefind-summary></pagefind-summary>
    <pagefind-results></pagefind-results>
  </div>
  <script type="module">
    import "https://cdn.jsdelivr.net/npm/@pagefind/component-ui@1.6.0/+esm";
  </script>
</article>
{% endblock content %}
