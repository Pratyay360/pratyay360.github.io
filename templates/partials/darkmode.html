<div class="darkmode">
  <input class="toggle" id="darkmode-toggle" type="checkbox" aria-label="Toggle dark mode">
  <label id="toggle-label-light" for="darkmode-toggle">
    <i class="fa-solid fa-sun" aria-hidden="true"></i>
    <span class="sr-only">Switch to light mode</span>
  </label>
  <label id="toggle-label-dark" for="darkmode-toggle">
    <i class="fa-solid fa-moon" aria-hidden="true"></i>
    <span class="sr-only">Switch to dark mode</span>
  </label>
</div>

<script>
  const userPref = window.matchMedia("(prefers-color-scheme: light)").matches
    ? "light"
    : "dark";
  const currentTheme = localStorage.getItem("theme") ?? userPref;
  const _syntaxTheme = document.querySelector("#theme-link");

  if (currentTheme) {
    document.documentElement.setAttribute("saved-theme", currentTheme);
  }

  const switchTheme = (e) => {
    if (e.target.checked) {
      document.documentElement.setAttribute("saved-theme", "dark");
      localStorage.setItem("theme", "dark");
    } else {
      document.documentElement.setAttribute("saved-theme", "light");
      localStorage.setItem("theme", "light");
    }
  };

  window.addEventListener("DOMContentLoaded", () => {
    const toggleSwitch = document.querySelector("#darkmode-toggle");
    toggleSwitch.addEventListener("change", switchTheme, false);

    if (currentTheme === "dark") {
      toggleSwitch.checked = true;
    }
  });
</script>
