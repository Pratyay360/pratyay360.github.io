{% include "partials/darkmode.html" %}

<header>
  <section class="nav-container">
    <a class="nav-title" href="{{ config.base_url | safe }}">
      <h2><i class="fa-solid fa-book-open icon-before" aria-hidden="true"></i>{{ config.title | default(value="Mabuya")}}</h2>
    </a>
    <nav>
      {% if config.extra.menu %}
      <ul>
        {% for menu in config.extra.menu %}
        <li><a class="nav-link" href="{{ get_url(path=menu.url, trailing_slash=true) | safe }}"><i class="{{ menu.icon }} icon-before" aria-hidden="true"></i>{{ menu.name }}</a></li>
        {% endfor %}
        <li><a class="nav-link" href="https://pratyay.online/"><i class="fa-solid fa-pen-nib icon-before" aria-hidden="true"></i>Blog</a></li>
      </ul>
      {% else %}
      <ul>
        <li><a class="nav-link" href="{{ config.base_url | safe }}"><i class="fa-solid fa-house icon-before" aria-hidden="true"></i>Home</a></li>
        <li><a class="nav-link" href="{{ get_url(path='tags') | safe }}"><i class="fa-solid fa-tags icon-before" aria-hidden="true"></i>Tags</a></li>
        <li><a class="nav-link" href="https://pratyay.online/"><i class="fa-solid fa-pen-nib icon-before" aria-hidden="true"></i>Blog</a></li>
      </ul>
      {% endif %}
    </nav>
  </section>
</header>
