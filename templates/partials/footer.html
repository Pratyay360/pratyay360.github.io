<footer>
  <div class="footer-actions">
    <a class="contact-cta" href="{{ config.extra.contact_url }}" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-envelope icon-before" aria-hidden="true"></i>Contact us</a>
  </div>
  <div class="footer-badges">
    <div id="wcb" class="carbonbadge"></div>
  </div>
  <span class="copyright">
    {%- if config.extra.footer -%}
    © 2026 {{ config.extra.author | default(value="pratyay") }}. {{ config.extra.footer.info | default(value='Powered by Zola.') | safe }}
    {%- else -%}
    © 2026. Powered by <a href="https://www.getzola.org"><u>Zola</u></a>.
    {%- endif -%}
  </span>
  <nav class="navigation-footer" aria-label="Footer">
    <ul>
      <li><a href="https://github.com/Pratyay360/pratyay360.github.io"><i class="fa-brands fa-github icon-before" aria-hidden="true"></i>GitHub</a></li>
      <li><a href="https://pratyay.online/" rel="noopener noreferrer"><i class="fa-solid fa-pen-nib icon-before" aria-hidden="true"></i>Blog</a></li>
    </ul>
  </nav>
</footer>
<script src="https://cdn.jsdelivr.net/npm/website-carbon-badges@1.1.3/b.min.js" defer></script>
{% if config.extra.goatcounter %}
<noscript>
  <img src="{{ config.extra.goatcounter }}?p={{ current_path | default(value='/404') | urlencode }}" alt="" width="1" height="1" />
</noscript>
{% endif %}

<div class="shareopenly-floating"></div>
<script defer src="https://shareopenly.org/js/v1/shareopenly.js"></script>
