name: ci

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write
  artifact-metadata: write

on:
  workflow_dispatch:
  pull_request:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@main

      - name: Install Zola
        uses: taiki-e/install-action@zola

      - name: Build
        run: zola build

      - name: Build search index
        run: npx --yes pagefind@1.6.0 --site dist

      # Must run before upload-pages-artifact, or the key file never reaches Pages.
      - name: index now key file
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key="$(printf '%s' "${INDEXNOW_KEY:-}" | tr -d '[:space:]')"
          if [ -z "$key" ]; then
            echo "::error::INDEXNOW_KEY secret is unset or blank"
            exit 1
          fi
          if ! printf '%s' "$key" | grep -Eq '^[A-Za-z0-9-]{8,128}$'; then
            echo "::error::INDEXNOW_KEY must be 8-128 chars of [A-Za-z0-9-]"
            exit 1
          fi
          printf '%s' "$key" > "./dist/${key}.txt"
          echo "Wrote ./dist/${key}.txt"

      - name: Upload artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@main
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@main

      - name: index now (bing)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.deployment.outcome == 'success'
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          sitemap=./dist/sitemap.xml
          if [ ! -f "$sitemap" ]; then
            echo "::error::missing $sitemap"
            exit 1
          fi
          key="$(printf '%s' "${INDEXNOW_KEY:-}" | tr -d '[:space:]')"
          if [ -z "$key" ]; then
            echo "::error::INDEXNOW_KEY secret is unset or blank"
            exit 1
          fi
          if ! printf '%s' "$key" | grep -Eq '^[A-Za-z0-9-]{8,128}$'; then
            echo "::error::INDEXNOW_KEY must be 8-128 chars of [A-Za-z0-9-]"
            exit 1
          fi
          host="pratyay360.github.io"
          urls=()
          while IFS= read -r url; do
            urls+=("$url")
          done < <(grep -o '<loc>[^<]*</loc>' "$sitemap" | sed -E 's#</?loc>##g')
          if [ "${#urls[@]}" -eq 0 ]; then
            echo "::error::no <loc> entries found in $sitemap"
            exit 1
          fi
          list=""
          for url in "${urls[@]}"; do
            url="${url//\\/\\\\}"
            url="${url//\"/\\\"}"
            [ -z "$list" ] || list+=$',\n'
            list+="    \"${url}\""
          done
          payload="$(mktemp)"
          trap 'rm -f "$payload"' EXIT
          printf '{\n  "host": "%s",\n  "key": "%s",\n  "keyLocation": "https://%s/%s.txt",\n  "urlList": [\n%s\n  ]\n}\n' \
            "$host" "$key" "$host" "$key" "$list" > "$payload"
          echo "Submitting ${#urls[@]} URLs to IndexNow"
          code="$(curl -sS --retry 3 --retry-delay 2 \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @"$payload" \
            -o /dev/null -w '%{http_code}' \
            https://www.bing.com/indexnow)" || code="curl-failed"
          echo "IndexNow response: ${code}"
          case "$code" in
            200|202) ;;
            *)
              echo "::error::IndexNow submission failed (HTTP ${code})"
              exit 1
              ;;
          esac
