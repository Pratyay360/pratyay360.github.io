name: cloudflare pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types: [content_update, blog_update]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    container:
        image: ghcr.io/jdx/mise:2026.9.6
    steps:
      - name: checkout code
        uses: actions/checkout@main
      - name: Cache mise installs
        uses: actions/cache@main
        with:
          path: |
            ~/.local/share/mise
            ~/.cache/mise
          key: mise-${{ runner.os }}-${{ hashFiles('mise.toml', '.mise.toml', 'mise.lock', '.mise.lock') }}
          restore-keys: |
            mise-${{ runner.os }}-

      - name: Cache fetch artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/fetch
            ~/.cache/pnpm
            ~/.cache/bun
            ~/.npm
          key: fetch-${{ runner.os }}-${{ hashFiles('mise.toml', 'mise.lock') }}
          restore-keys: |
            fetch-${{ runner.os }}-

      - name: Install dependencies & deploy
        run: |
            mise deps
            mise run fetch
            mise run build
            mise run deploy
            # mise run deploy1

        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}



